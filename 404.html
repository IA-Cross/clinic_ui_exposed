<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Clínica Odontológica Verboonen</title>
    <!--
      spa-github-pages (https://github.com/rafgraph/spa-github-pages)
      GitHub Pages no soporta SPAs: cualquier ruta profunda (p.ej. /blog/articulo)
      devuelve este 404, que convierte la ruta en query string y redirige a
      index.html, donde el script gemelo la restaura para React Router.
      pathSegmentsToKeep = 1 conserva el segmento /clinic_ui_exposed/.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
