# Compila y publica el sitio en GitHub Pages.
#  - En cada push a main
#  - Cada lunes 7:00 UTC: regenera el sitemap con los artículos publicados.
#    Esa consulta a Supabase sirve además de "ping" para que el proyecto
#    gratuito no se pause por inactividad.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Acepta los valores como Secrets o como Variables (pestañas distintas en
      # Settings → Secrets and variables → Actions), a nivel repositorio o del
      # environment gh-pages.
      - name: Verificar variables de entorno
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan en el build:$missing"
            echo "::error::Créalos en Settings → Secrets and variables → Actions como 'Repository secrets' (o en el environment 'gh-pages'). Sin ellos el login y el blog no funcionan."
            exit 1
          fi
          echo "Variables de Supabase presentes ✓"

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || vars.VITE_SITE_URL }}
          VITE_GOATCOUNTER_CODE: ${{ secrets.VITE_GOATCOUNTER_CODE || vars.VITE_GOATCOUNTER_CODE }}

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
